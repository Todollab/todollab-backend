spring.application.name=todollab-backend
spring.profiles.default=dev
server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todollab}
spring.datasource.username=${DB_USER:todollab}
spring.datasource.password=${DB_PASSWORD:todollab}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

api.security.token.secret=${JWT_SECRET:todollab-dev-secret-key-change-in-production-min-32-chars}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAME_SITE:Lax}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:no-reply@todollab.local}
app.mail.from-name=${MAIL_FROM_NAME:Todollab}
app.mail.brevo.api-key=${BREVO_API_KEY:}
app.mail.resend.api-key=${RESEND_API_KEY:}

springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
