spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todollab}
spring.datasource.username=${DB_USER:todollab}
spring.datasource.password=${DB_PASSWORD:todollab}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}

api.security.token.secret=${JWT_SECRET:todollab-dev-secret-key-change-in-production-min-32-chars}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.mail.from=${MAIL_FROM:no-reply@todollab.local}
