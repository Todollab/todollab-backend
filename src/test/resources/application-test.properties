spring.datasource.url=jdbc:h2:mem:todollab;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.target=1

# TODO(Task 2): Switch to validate once legacy com.todollab.model.User is replaced by the V1 User entity
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

api.security.token.secret=test-jwt-secret-key-for-todollab-integration-tests-only
app.frontend-url=http://localhost:5173
app.cors.allowed-origins=http://localhost:5173
app.cookie.secure=false
app.mail.from=no-reply@todollab.test
